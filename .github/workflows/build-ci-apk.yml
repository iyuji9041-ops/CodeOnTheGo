name: Build V8 Debug APK (CI)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build V8 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools, NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Setup Google Services Config
        run: |
          if [ ! -f "app/google-services.json" ]; then
            cat << 'JSON' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "codeonthego-debug",
              "storage_bucket": "codeonthego-debug.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.itsaky.androidide"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_ci_build"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
JSON
          fi

      - name: Assemble V8 Debug APK
        run: |
          ./gradlew :app:assembleV8Debug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeOnTheGo-v8-debug
          path: app/build/outputs/apk/v8/debug/*.apk
          if-no-files-found: error
          retention-days: 14
