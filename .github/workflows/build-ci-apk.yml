name: Build V8 Debug APK (CI)

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build V8 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
          cache: 'gradle'

      - name: Install Android Build Tools, NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Set Java_ROOT environment variable
        run: echo "Java_ROOT=$JAVA_HOME_8_X64" >> $GITHUB_ENV

      - name: Setup Google Services Config
        run: bash scripts/setup-google-services.sh

      - name: Assemble V8 Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleV8Debug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeOnTheGo-v8-debug
          path: app/build/outputs/apk/v8/debug/*.apk
          if-no-files-found: error
          retention-days: 14
